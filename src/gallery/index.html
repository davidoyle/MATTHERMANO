<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery · Matt Hermano</title>
    <meta name="description" content="Photos of Matt Hermano live in Vancouver." />
    <!--@head-->
  </head>
  <body>
    <!--@header-->

    <main id="main" class="wrap gallery-page">
      <header class="page-head">
        <h1 class="page-title">On stage</h1>
      </header>
      <section class="gallery" data-gallery tabindex="0" aria-label="Photo carousel. Use the arrow keys to move between photos.">
        <div class="gallery-viewport" data-gallery-viewport></div>
        <div class="gallery-controls">
          <button class="icon-btn" type="button" data-gallery-prev aria-label="Previous photo">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m5-5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <p class="gallery-count" data-gallery-count aria-live="polite"></p>
          <button class="icon-btn" type="button" data-gallery-next aria-label="Next photo">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
        <div class="gallery-thumbs" data-gallery-thumbs></div>
      </section>
    </main>

    <!--@footer-->
    <script type="module" src="/main.ts"></script>
  </body>
</html>

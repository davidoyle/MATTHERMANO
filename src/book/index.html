<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a show · Matt Hermano</title>
    <meta name="description" content="Book Matt Hermano for house concerts, listening rooms, venue sets and private events. Based in Vancouver, BC." />
    <!--@head-->
  </head>
  <body>
    <!--@header-->

    <main id="main" class="wrap book">
      <section class="book__intro" aria-labelledby="book-title">
        <!--@corner-->
        <p class="eyebrow">Booking</p>
        <h1 class="page-title" id="book-title">Book a show</h1>
        <p class="lead">Have a room that listens? Let's talk about a date.</p>
        <ul class="book__facts">
          <li><span class="tag">Based in</span> Vancouver, BC.</li>
          <li><span class="tag">The set</span> Original songs and soul covers, from The Temptations to Bruno Mars.</li>
          <li><span class="tag">The rooms</span> House concerts, cafes and listening rooms, venue sets and private events.</li>
        </ul>
        <!--@email-line-->
      </section>

      <form class="booking-form" action="https://formspree.io/f/xeepnjjr" method="POST">
        <label for="name">Name<input id="name" type="text" name="name" autocomplete="name" required /></label>
        <label for="email">Email<input id="email" type="email" name="email" autocomplete="email" required /></label>
        <label for="eventType"
          >Event type
          <select id="eventType" name="eventType" required>
            <option value="">Select one</option>
            <option value="house-concert">House concert</option>
            <option value="venue">Venue set</option>
            <option value="private">Private event</option>
          </select>
        </label>
        <label for="eventDate">Date<input id="eventDate" type="date" name="eventDate" /></label>
        <label for="message">Message<textarea id="message" name="message" rows="6" placeholder="Where, when, roughly how many people, and anything else Matt should know." required></textarea></label>
        <button class="btn btn--primary" type="submit">Send inquiry</button>
      </form>
    </main>

    <!--@footer-->
    <script type="module" src="/main.ts"></script>
  </body>
</html>
